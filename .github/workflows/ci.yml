name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore XtreamForge.slnx

      - name: Build
        run: dotnet build XtreamForge.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test XtreamForge.slnx --configuration Release --no-build
