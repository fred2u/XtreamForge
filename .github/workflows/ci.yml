name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore XtreamForge.slnx

      - name: Build
        run: dotnet build XtreamForge.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution XtreamForge.slnx --configuration Release --no-build --results-directory TestResults --report-trx --coverage --coverage-output-format cobertura

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
