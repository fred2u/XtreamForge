# XtreamForge on Synology (Container Manager > Project)
# All settings live in the .env file next to this file (template: .env.example).
# No port is published on the NAS: Nginx Proxy Manager reaches the backend and the admin UI
# through its external Docker network npm_internal (see README.md).
services:
  postgres:
    image: postgres:18-alpine
    container_name: xtreamforge-postgres
    hostname: xtreamforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xtreamforge
      POSTGRES_USER: xtreamforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from .env}
    volumes:
      # PostgreSQL 18 images keep their data in a versioned subfolder of /var/lib/postgresql
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xtreamforge -d xtreamforge"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

  api:
    image: ghcr.io/fred2u/xtreamforge-api:latest
    container_name: xtreamforge-api
    hostname: xtreamforge-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__database: "Host=xtreamforge-postgres;Port=5432;Database=xtreamforge;Username=xtreamforge;Password=${POSTGRES_PASSWORD}"
      Tmdb__ApiKey: ${TMDB_API_KEY:?TMDB_API_KEY is missing from .env}
      XtreamProxy__AllowedHosts__0: ${XTREAM_HOST_0:?XTREAM_HOST_0 is missing from .env}
      XtreamProxy__AllowedHosts__1: ${XTREAM_HOST_1:-}
      XtreamProxy__AllowedHosts__2: ${XTREAM_HOST_2:-}
      # Nginx Proxy Manager is trusted for X-Forwarded-Proto/Host, so the stream URLs use the public scheme, host and port
      ReverseProxy__KnownNetworks__0: ${REVERSE_PROXY_NETWORK:?REVERSE_PROXY_NETWORK is missing from .env}
    networks:
      - default
      - npm_internal

  web:
    image: ghcr.io/fred2u/xtreamforge-web:latest
    container_name: xtreamforge-web
    hostname: xtreamforge-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      Backend__BaseUrl: "http://xtreamforge-api:8080"
    networks:
      - npm_internal

networks:
  default:
  npm_internal:
    external: true
