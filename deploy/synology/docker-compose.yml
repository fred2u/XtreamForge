# XtreamForge sur Synology (Container Manager > Projet)
# Tous les réglages se font dans le fichier .env placé dans le même dossier que ce fichier.
services:
  postgres:
    image: postgres:17
    container_name: xtreamforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xtreamforge
      POSTGRES_USER: xtreamforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xtreamforge -d xtreamforge"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/fred2u/xtreamforge-api:latest
    container_name: xtreamforge-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__database: "Host=postgres;Port=5432;Database=xtreamforge;Username=xtreamforge;Password=${POSTGRES_PASSWORD}"
      Tmdb__ApiKey: ${TMDB_API_KEY:?TMDB_API_KEY manquant dans .env}
      XtreamProxy__AllowedHosts__0: ${XTREAM_HOST:?XTREAM_HOST manquant dans .env}
    ports:
      - "${API_PORT:-8080}:8080"   # proxy Xtream (+ API d'admin, sans authentification)

  web:
    image: ghcr.io/fred2u/xtreamforge-web:latest
    container_name: xtreamforge-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      Backend__BaseUrl: "http://api:8080"
    ports:
      - "${ADMIN_PORT:-8081}:8080"   # interface d'administration
